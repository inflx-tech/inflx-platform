apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["brandDebug", "influencerDebug", "followerDebug", "followerStagingDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Play Store upload signing - opt-in, one app at a time.
 *
 *   gradlew bundleBrandRelease -PplayRelease=brand
 *
 * reads brand.storeFile / brand.storePassword / brand.keyAlias / brand.keyPassword
 * from android/keystore.properties (git-ignored, NEVER committed) and signs ONLY
 * that flavor's release with its upload key. The other flavors' release outputs
 * come out unsigned in that run, so one app's key can never sign another app.
 *
 * Without -PplayRelease nothing changes: release builds keep the debug key,
 * exactly as the sideloaded APKs in /APKs always have.
 */
def playFlavor = project.findProperty("playRelease")
def playSigning = [:]
if (playFlavor) {
    def propsFile = rootProject.file("keystore.properties")
    if (!propsFile.exists()) {
        throw new GradleException("-PplayRelease=${playFlavor} needs android/keystore.properties - copy keystore.properties.example and fill it in.")
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { k ->
        def v = props.getProperty("${playFlavor}.${k}")?.trim()
        if (!v) {
            throw new GradleException("android/keystore.properties has no value for ${playFlavor}.${k}")
        }
        playSigning[k] = v
    }
    if (!file(playSigning.storeFile).exists()) {
        throw new GradleException("Upload keystore not found at ${playSigning.storeFile}")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "in.inflx.app"
    defaultConfig {
        applicationId "in.inflx.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Default — overridden per flavor
        resValue "string", "app_role", "follower"
        // Maps SDK for Android key — supplied at APK build time via the
        // MAPS_SDK_ANDROID gradle property (gradle.properties / -P / CI env),
        // NEVER committed. Restrict the key to in.inflx.app.* + signing SHA-1.
        manifestPlaceholders = [
            MAPS_SDK_ANDROID: (project.findProperty("MAPS_SDK_ANDROID") ?: System.getenv("MAPS_SDK_ANDROID") ?: "")
        ]
    }
    flavorDimensions "role"
    productFlavors {
        brand {
            dimension "role"
            // The brand app's id is com.inflx.brand - the id it carries on the
            // Play Store. It is a full id, not a suffix on in.inflx.app like the
            // other apps. Code still lives in the in.inflx.app namespace, so no
            // Kotlin package or import changes with it.
            applicationId "com.inflx.brand"
            // Each app is its own Play listing with its own version codes. Play took code 1 for
            // the brand app on an upload in October 2026, so the brand app counts on from 2.
            // Raise it by one for every upload Play accepts; versionName is what people see.
            versionCode 2
            resValue "string", "app_role", "brand"
        }
        influencer {
            dimension "role"
            // Same rule as brand: com.inflx.influencer is the id this app carries
            // on the Play Store - a full id, not a suffix on in.inflx.app.
            applicationId "com.inflx.influencer"
            // Its own Play listing, its own version codes: counts on from 2 (October 2026),
            // one higher for every upload Play accepts.
            versionCode 2
            resValue "string", "app_role", "influencer"
        }
        follower {
            dimension "role"
            // Same rule as brand and influencer: com.inflx.followers is the id the
            // shopper app carries on the Play Store. Note the id is plural while the
            // flavor stays `follower`. The staging twin below keeps its own id.
            applicationId "com.inflx.followers"
            // Its own Play listing, its own version codes: counts on from 2 (October 2026),
            // one higher for every upload Play accepts.
            versionCode 2
            resValue "string", "app_role", "follower"
        }
        // Staging twin of `follower` — separate app id + label so it installs
        // ALONGSIDE the real follower app and points at staging (debug build →
        // api-overrides → local backend on staging DB via adb reverse).
        followerStaging {
            dimension "role"
            applicationIdSuffix ".follower.staging"
            resValue "string", "app_role", "follower"
        }
        // Docs/THE_CUT.md pass 1 — the `agency` flavor is gone. It built a fourth app
        // whose entire JS was removed in the same pass, so building it would have
        // produced an installable app with no screens. Production held zero agency
        // accounts, so no installed copy is stranded.
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (playFlavor) {
            play {
                storeFile file(playSigning.storeFile)
                storePassword playSigning.storePassword
                keyAlias playSigning.keyAlias
                keyPassword playSigning.keyPassword
            }
        }
    }
    if (playFlavor) {
        def playTarget = productFlavors.findByName(playFlavor)
        if (playTarget == null) {
            throw new GradleException("-PplayRelease=${playFlavor} is not one of the app flavors: ${productFlavors.names}")
        }
        playTarget.signingConfig = signingConfigs.play
    }
    packaging {
        jniLibs {
            // react-native-compressor bundles AndroidLame (MP3 audio). Its x86_64 copy is 4 KB
            // aligned, which Google Play's 16 KB page-size check refuses. The app never
            // compresses audio (src/utils/videoPrep.js uses Video and Image only), so that
            // library is never loaded; every other native library is 16 KB ready.
            excludes += ["lib/x86_64/libandroidlame.so"]
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sideload builds keep the debug key. A Play build (-PplayRelease=<flavor>)
            // leaves this unset so the flavor's own upload key above is used -
            // a build type's signing config would otherwise override the flavor's.
            if (!playFlavor) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}


// ─── Flow 28 (2026-05-26): react-native-vector-icons MaterialCommunityIcons ───
// One-time NATIVE_RUNTIME bump 1→2; required by mobile-influencer bucket Flow 28
// onwards for real outline icon glyphs in tabs + notifications + inline tiles.
// Only MaterialCommunityIcons.ttf bundled (~600KB) — saves ~6MB vs all 14 fonts.
project.ext.vectoricons = [
    iconFontNames: [ 'MaterialCommunityIcons.ttf' ]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
