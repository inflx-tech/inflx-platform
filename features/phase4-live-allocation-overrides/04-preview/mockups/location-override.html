<!doctype html>
<html><head><meta charset="utf-8"><title>Phase 4a — Location override in Rule options</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f9fafb;margin:0;padding:24px;color:#111}
  .panel{max-width:640px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:0 auto 20px}
  h2{font-size:14px;margin:0 0 12px}
  .box{border:1px solid #e5e7eb;border-radius:12px;padding:12px}
  .title{font-size:12px;font-weight:700;margin-bottom:8px}
  .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  label{font-size:11px;font-weight:600;color:#4b5563;display:block}
  select,input{font-size:11px;border:1px solid #d1d5db;border-radius:6px;padding:4px 8px;display:block;margin-top:2px}
  .hint{font-size:10px;color:#9ca3af;margin-top:6px}
</style></head><body>

<div class="panel">
  <h2>Rule options — a Shops row inside rank-only Fashion opts into a boundary</h2>
  <div class="box">
    <div class="title">Rule options</div>
    <div class="row">
      <label>Location
        <select>
          <option>World default</option>
          <option selected>Boundary (hard radius)</option>
          <option>Rank only</option>
          <option>Ignore location</option>
        </select>
      </label>
      <label>Radius km<input type="number" value="15" style="width:80px"></label>
      <label style="display:flex;align-items:center;gap:6px;padding-bottom:4px"><input type="checkbox"> Only shops with a live offer</label>
    </div>
    <div class="hint">"World default" = whatever World Settings says for this world · override applies to THIS section only</div>
  </div>
</div>

</body></html>
