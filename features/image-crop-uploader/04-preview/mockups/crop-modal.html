<!doctype html>
<html><head><meta charset="utf-8"><title>Crop-to-frame modal (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:rgba(0,0,0,.5);margin:0;min-height:480px;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:18px;width:360px}
.t{font-weight:800;font-size:15px}
.s{font-size:11.5px;color:#71717A;margin:2px 0 12px}
.frame{width:320px;height:213px;border-radius:12px;overflow:hidden;border:1px solid #E4E4E7;margin:0 auto;position:relative;background:#f1f1ee}
.img{position:absolute;top:-18px;left:-30px;width:380px;height:250px;background:linear-gradient(135deg,#5b8def,#8f6ed5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
.zoom{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:#71717A}
.zoom input{flex:1}
.row{display:flex;justify-content:space-between;margin-top:16px}
.g{border:1px solid #E4E4E7;background:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px}
.ink{border:0;background:#0A0A0A;color:#FFC107;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px}
</style></head><body>
  <div class="box">
    <div class="t">Position your image</div>
    <div class="s">Full-width banner · 3:2 — it's auto-centred. Drag or zoom only if something important is cut off.</div>
    <div class="frame"><div class="img">🧥</div></div>
    <div class="zoom"><span>Zoom</span><input type="range" min="1" max="3" value="1.2"></div>
    <div class="row"><button class="g">Cancel</button><button class="ink">Use this crop</button></div>
  </div>
</body></html>
