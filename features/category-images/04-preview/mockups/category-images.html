<!doctype html>
<html><head><meta charset="utf-8"><title>Category images admin (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;margin:0;padding:24px;font-size:13px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;font-weight:800;margin:0}
.sub{color:#71717A;font-size:12px;margin:4px 0 14px}
.list{border:1px solid #E4E4E7;border-radius:12px;overflow:hidden;background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-top:1px solid #F4F4F5}
.th{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;background:#F4F4F5;display:flex;align-items:center;justify-content:center;color:#C7C7CC}
.img{width:100%;height:100%;background:linear-gradient(135deg,#5b8def,#8f6ed5)}
.nm{flex:1;font-weight:600}
.meta{font-size:11px;color:#A1A1AA}
.up{color:#1D4ED8;font-weight:700}
.rm{color:#B91C1C;font-size:11px}
</style></head><body><div class="wrap">
  <h1>🖼️ Category Images</h1>
  <div class="sub">Give each category a picture (square). Shows in the follower rail + tiles. 2/24 have an image.</div>
  <div class="list">
    <div class="row" style="padding-left:12px"><div class="th">▸</div><div class="nm">Men<div class="meta">fashion</div></div><span class="up">Upload</span></div>
    <div class="row" style="padding-left:30px"><div class="th"><div class="img"></div></div><div class="nm">Topwear<div class="meta">Men</div></div><span class="up">Replace</span><span class="rm">Remove</span></div>
    <div class="row" style="padding-left:48px"><div class="th">◆</div><div class="nm">T-Shirt<div class="meta">Men › Topwear · leaf</div></div><span class="up">Upload</span></div>
    <div class="row" style="padding-left:48px"><div class="th"><div class="img"></div></div><div class="nm">Polo<div class="meta">Men › Topwear · leaf</div></div><span class="up">Replace</span><span class="rm">Remove</span></div>
  </div>
</div></body></html>
