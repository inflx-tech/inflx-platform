<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Follower — Mosaic + Timer frame</title>
<style>
  :root{--ink:#26201a;--muted:#8a7d6b;--line:#ece4d8;--pink:#E11D6B;--yellowTint:#fdf3d0;--yellowDeep:#c9a227;}
  *{box-sizing:border-box;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;}
  body{margin:0;background:#f4efe7;padding:20px;}
  .phone{max-width:380px;margin:0 auto;background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden;padding-bottom:16px;}
  .frameTitle{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.3px;padding:14px 16px 0;}
  .cd{margin:12px 16px 2px;background:var(--pink);border-radius:10px;padding:8px 12px;text-align:center;}
  .cd span{color:#fff;font-size:12.5px;font-weight:800;font-family:ui-monospace,monospace;letter-spacing:1px;}
  .mosaic{display:flex;flex-wrap:wrap;padding:12px 8px 0;}
  .cell{padding:4px;}
  .cell.lg{width:100%;}
  .cell.sm{width:50%;}
  .inner{border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;background:linear-gradient(135deg,#fbe3ec,#fdf3d0);display:flex;align-items:flex-end;}
  .inner.lg{height:150px;}
  .inner.sm{height:112px;}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,rgba(0,0,0,.4));}
  .tl{position:relative;color:#fff;font-size:14px;font-weight:800;padding:10px;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);font-size:34px;opacity:.55;}
  .cap{max-width:380px;margin:10px auto 0;text-align:center;font-size:11px;color:#8a7d6b;}
</style></head><body>
<div class="phone">
  <div class="frameTitle">🔥 Festive Fashion Sale</div>
  <div class="cd"><span>⏳ Sale ends in 01:59:42</span></div>
  <div class="mosaic">
    <div class="cell lg"><div class="inner lg"><div class="emoji">👗</div><div class="scrim"></div><div class="tl">Festive Edit — up to 60% off</div></div></div>
    <div class="cell sm"><div class="inner sm"><div class="emoji">👕</div><div class="scrim"></div><div class="tl">Under ₹999</div></div></div>
    <div class="cell sm"><div class="inner sm"><div class="emoji">👖</div><div class="scrim"></div><div class="tl">New in Denim</div></div></div>
  </div>
</div>
<div class="cap">Countdown bar pinned above · large tile full-width, small tiles 2-up · tap a tile → its product grid · timer hits zero → frame disappears.</div>
</body></html>
