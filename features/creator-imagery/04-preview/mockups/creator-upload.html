<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>INFLX Creator — Add your photos</title>
<style>
  :root{--ink:#1a1a1a;--muted:#6b6b6b;--line:#ebe3d2;--bg:#f7f4ec;--card:#fff;--gold:#F6B11E;--g:#1D9E75;--amber:#CA8A04;--red:#B91C1C}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#eee}
  .wrap{display:flex;justify-content:center;padding:24px}
  .phone{width:300px;border:10px solid #111;border-radius:34px;background:var(--bg);overflow:hidden}
  .bar{height:26px;background:#111}.scr{padding:12px}
  .top{font-size:15px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .up{border:2px dashed #cfc6ab;border-radius:14px;background:#fbf6e8;padding:20px;text-align:center;margin-bottom:14px}
  .up .ic{font-size:28px}.up .t{font-weight:800;font-size:13px;margin-top:6px}.up .h{font-size:11px;color:var(--muted)}
  .lbl{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:10px 0 6px}
  .row{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px}
  .thumb{width:46px;height:46px;border-radius:9px;background:#3a3a3d;display:flex;align-items:center;justify-content:center;font-size:20px}
  .row .nm{font-weight:700;font-size:12px}.row .m{font-size:10px;color:var(--muted)}
  .pill{font-size:9px;font-weight:800;border-radius:999px;padding:3px 8px;margin-left:auto}
  .ok{background:#e6f6ec;color:var(--g);border:1px solid #bfe6d6}
  .pend{background:#fef9e7;color:var(--amber);border:1px solid #f6e4a8}
  .rej{background:#fdedea;color:var(--red);border:1px solid #f3c4b8}
</style></head><body>
<div class="wrap"><div class="phone"><div class="bar"></div><div class="scr">
  <div class="top">Add your photos</div>
  <div class="sub">Shoot the products, upload, tag which product — the brand approves.</div>

  <div class="up"><div class="ic">📷</div><div class="t">Upload a shot</div><div class="h">JPG/PNG · aspect auto-detected</div></div>

  <div class="lbl">TAG PRODUCT</div>
  <div class="row"><div class="thumb">👕</div><div><div class="nm">Oversized Tee</div><div class="m">tap to tag this shot</div></div><span class="pill pend" style="background:#111;color:#fff">Tag →</span></div>

  <div class="lbl">MY SHOTS</div>
  <div class="row"><div class="thumb">👟</div><div><div class="nm">Sneakers</div><div class="m">landscape</div></div><span class="pill ok">Approved</span></div>
  <div class="row"><div class="thumb">🧥</div><div><div class="nm">Jacket</div><div class="m">portrait</div></div><span class="pill pend">Pending</span></div>
  <div class="row"><div class="thumb">🧢</div><div><div class="nm">Cap</div><div class="m">square</div></div><span class="pill rej">Rejected</span></div>
</div></div></div>
</body></html>
