<!doctype html>
<html><head><meta charset="utf-8"><title>In-category search (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;margin:0;padding:24px;font-size:13px}
.wrap{max-width:320px;margin:0 auto;background:#fff;border:1px solid #E4E4E7;border-radius:14px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #F4F4F5}
.si{flex:1;background:#F4F4F5;border-radius:10px;padding:7px 12px;color:#0A0A0A}
.body{display:flex}
.rail{width:80px;padding:6px 0}
.ri{padding:8px 4px;text-align:center}.ri.on{background:#FFFBEB}
.rimg{width:40px;height:40px;border-radius:9px;background:#EAF1FF;margin:0 auto 4px}
.nm{font-size:9.5px;color:#52525B}
.pane{flex:1;padding:8px}
.pt{font-size:12px;font-weight:800;margin-bottom:6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p{background:#F4F4F5;border-radius:8px;height:56px}
</style></head><body><div class="wrap">
  <div class="hd">← <div class="si">cotton</div> ✕</div>
  <div class="body">
    <div class="rail"><div class="ri on"><div class="rimg"></div><div class="nm">Polo</div></div><div class="ri"><div class="rimg"></div><div class="nm">T-Shirt</div></div></div>
    <div class="pane"><div class="pt">Results for “cotton”</div><div class="g"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div></div>
  </div>
</div>
<p style="max-width:320px;margin:12px auto 0;font-size:12px;color:#71717A">Tapping ⌕ opens a search bar; typing filters products within this category.</p>
</body></html>
