<!doctype html>
<html><head><meta charset="utf-8"><title>Hierarchical drill (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;margin:0;padding:24px;font-size:13px}
.wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid #E4E4E7;border-radius:12px;overflow:hidden}
.hd{font-size:11px;font-weight:800;color:#52525B;padding:8px 10px;border-bottom:1px solid #F4F4F5}
.b{display:flex;height:130px}
.rail{width:74px;background:#F9FAFB;border-right:1px solid #E4E4E7;font-size:9.5px;text-align:center;color:#52525B}
.rail div{padding:6px 2px}.rail .on{background:#EAF1FF;color:#1D4ED8;font-weight:700;border-radius:6px}
.g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px}
.p{background:#F4F4F5;border-radius:6px}
.ar{text-align:center;color:#A1A1AA;align-self:center;font-size:18px}
</style></head><body><div class="wrap">
  <div class="card"><div class="hd">Men (all Men's products)</div><div class="b"><div class="rail"><div class="on">Topwear</div><div>Bottomwear</div><div>Footwear</div></div><div class="g"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div></div></div>
  <div class="card"><div class="hd">Men › Topwear</div><div class="b"><div class="rail"><div class="on">T-Shirts</div><div>Polo</div><div>Shirts</div></div><div class="g"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div></div></div>
  <div class="card"><div class="hd">Men › Topwear › T-Shirts</div><div class="b"><div class="rail"><div class="on">T-Shirts</div><div>Polo</div></div><div class="g"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div></div></div>
</div>
<p style="max-width:760px;margin:14px auto 0;font-size:12px;color:#71717A">Each tap drills one level: the rail becomes that node's subcategories, the grid shows that node's products. Never blank.</p>
</body></html>
