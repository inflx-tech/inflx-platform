<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>INFLX Follower — Fashion Home (lit up)</title>
<style>
  :root{--ink:#1a1d1f;--muted:#6b7280;--line:#e8eaed;--bg:#f4f5f7;--card:#fff;--y:#F8CB46;--g:#1D9E75;--concrete:#2c2c2f}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#eee}
  .wrap{display:flex;justify-content:center;padding:24px}
  .phone{width:320px;border:10px solid #111;border-radius:34px;background:var(--bg);overflow:hidden}
  .bar{height:26px;background:#111}
  .scr{padding:12px}
  .loc{font-size:11px;color:var(--muted);margin-bottom:10px}.loc b{color:var(--ink)}
  .shelfh{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
  .shelfh .t{font-weight:800;font-size:14px}.shelfh .v{font-size:11px;color:var(--muted)}
  .new{display:inline-block;font-size:9px;font-weight:800;color:var(--g);background:#e6f6ec;border:1px solid #bfe6d6;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
  /* rendered Street Style Hero (AdaptiveRenderer output) */
  .hero{height:150px;border-radius:14px;overflow:hidden;position:relative;background:var(--concrete)}
  .hero .av{position:absolute;top:9px;left:9px;width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid #fff}
  .hero .badge{position:absolute;top:11px;right:10px;background:var(--g);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
  .hero .shoe{position:absolute;right:12px;top:36px;font-size:48px}
  .hero .cap{position:absolute;left:11px;bottom:11px}
  .hero .ti{color:#fff;font-weight:800;font-size:20px}
  .hero .st{color:#dcdcdc;font-size:10px;margin:2px 0 6px}
  .hero .cta{background:var(--y);color:#1a1d1f;font-size:10px;font-weight:800;padding:4px 10px;border-radius:7px;display:inline-block}
  .hero .by{position:absolute;left:11px;bottom:-0}
  .prow{display:flex;gap:8px;margin-top:10px;overflow:hidden}
  .pc{width:92px;flex:0 0 92px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .pc .im{height:64px;background:#eef0f2;display:flex;align-items:center;justify-content:center;font-size:22px}
  .pc .nm{font-size:9px;padding:4px;font-weight:700}.pc .pr{font-size:9px;padding:0 4px 5px;color:var(--muted)}
  .other{height:70px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-top:6px}
</style></head><body>
<div class="wrap"><div class="phone"><div class="bar"></div><div class="scr">
  <div class="loc">📍 <b>Vijayawada</b> · Fashion</div>

  <div class="shelfh"><div class="t">Street Style <span class="new">NEW</span></div><div class="v">See all ›</div></div>
  <div class="hero">
    <div class="av">R</div><div class="badge">20% OFF</div><div class="shoe">👟</div>
    <div class="cap"><div class="ti">Rahul's Street Style</div><div class="st">Urban looks curated for everyday confidence.</div><span class="cta">Explore collection</span></div>
  </div>
  <div class="prow">
    <div class="pc"><div class="im">👕</div><div class="nm">Oversized Tee</div><div class="pr">₹1,299</div></div>
    <div class="pc"><div class="im">👟</div><div class="nm">Sneakers</div><div class="pr">₹2,499</div></div>
    <div class="pc"><div class="im">🧥</div><div class="nm">Jacket</div><div class="pr">₹3,499</div></div>
  </div>

  <div class="shelfh"><div class="t">Trending in Vijayawada</div><div class="v">See all ›</div></div>
  <div class="other">(existing shelves — unchanged)</div>
</div></div></div>
</body></html>
