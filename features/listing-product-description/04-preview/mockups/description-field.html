<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Basics step — Description field</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #FAFAFA; color: #0A0A0A;
    font-family: 'Plus Jakarta Sans','Outfit',system-ui,sans-serif; font-size: 13px; }
  .panel { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #E4E4E7;
    border-radius: 14px; padding: 16px; }
  .fl { display: block; font-size: 11px; font-weight: 700; color: #1F1F22; margin: 12px 0 5px; }
  .muted2 { color: #A1A1AA; font-weight: 500; }
  .req { color: #E8401A; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input.t, textarea.t { width: 100%; background: #fff; border: 1px solid #E4E4E7; border-radius: 9px;
    padding: 10px; font-size: 13px; font-family: inherit; color: #0A0A0A; }
  textarea.t { resize: vertical; min-height: 72px; line-height: 1.5; }
  .newtag { font-size: 9px; font-weight: 800; background: #FFF7CC; color: #6B5A00;
    border-radius: 5px; padding: 1px 6px; margin-left: 6px; }
</style>
</head>
<body>
  <div class="panel">
    <div style="font-family:'Outfit';font-weight:800;font-size:16px;margin-bottom:2px;">Add T-Shirt</div>
    <div style="font-size:12px;color:#71717A;margin-bottom:8px;">Women › Western Wear › Top</div>

    <label class="fl">Cover photos (up to 6) — the first is the cover <span class="req">*</span></label>
    <input class="t" type="file" />

    <div class="row" style="margin-top:6px;">
      <div style="flex:1;min-width:170px;"><label class="fl">Product name <span class="req">*</span></label><input class="t" value="Biba Straight Kurta" /></div>
      <div style="flex:1;min-width:150px;"><label class="fl">Brand</label><input class="t" value="Biba" /></div>
    </div>
    <div class="row">
      <div style="width:130px;"><label class="fl">Price ₹ <span class="req">*</span></label><input class="t" value="1499" /></div>
      <div style="width:110px;"><label class="fl">Stock</label><input class="t" value="20" /></div>
      <div style="flex:1;min-width:150px;"><label class="fl">SKU <span class="muted2">(auto — leave blank)</span></label><input class="t" placeholder="auto-generated" /></div>
    </div>

    <div>
      <label class="fl">Description <span class="muted2">(optional)</span><span class="newtag">NEW</span></label>
      <textarea class="t" placeholder="Fabric feel, fit, styling tips, care — anything that helps a shopper decide.">Straight-cut cotton kurta, breathable for daily wear. Machine wash cold.</textarea>
    </div>
  </div>
</body>
</html>
