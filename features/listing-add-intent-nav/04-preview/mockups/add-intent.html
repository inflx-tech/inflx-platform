<!doctype html>
<html><head><meta charset="utf-8"><title>Add-item lands on Add products (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;color:#0A0A0A;font-size:13px;margin:0;padding:24px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin:0}
.rule{height:1px;background:#E4E4E7;margin:12px 0}
.tabs{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid #E4E4E7}
.tab{padding:9px 16px;font-weight:700;color:#71717A;border-bottom:2px solid transparent}
.tab.on{color:#0A0A0A;border-bottom-color:#FFC107}
.crumb{color:#71717A;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.node{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.nm{font-weight:800}.mt{font-size:11px;color:#71717A;margin-top:3px}
.note{background:#FFF7CC;border:1px solid #FFC107;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
</style></head><body><div class="wrap">
  <div class="note">URL: /dashboard/products/listing<b>?tab=add</b> — arrived from the store page "➕ Add item" button. Lands HERE, not on My listings.</div>
  <h1>Add products — fashion</h1>
  <div class="rule"></div>
  <div class="tabs">
    <span class="tab">My listings</span>
    <span class="tab on">Add products</span>
    <span class="tab">Offers</span>
  </div>
  <div class="crumb">fashion ›</div>
  <div class="grid">
    <div class="node"><div><div class="nm">Men</div><div class="mt">8 categories</div></div><div>›</div></div>
    <div class="node"><div><div class="nm">Women</div><div class="mt">11 categories</div></div><div>›</div></div>
    <div class="node"><div><div class="nm">Kids</div><div class="mt">6 categories</div></div><div>›</div></div>
  </div>
</div></body></html>
