<!doctype html>
<html><head><meta charset="utf-8"><title>Wizard details step — curated tag chips (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;color:#0A0A0A;font-size:13px;margin:0;padding:24px}
.wrap{max-width:640px;margin:0 auto;background:#fff;border:1px solid #E4E4E7;border-radius:16px;padding:20px}
h2{font-size:16px;font-weight:800;margin:0 0 4px}
.sub{color:#71717A;font-size:12px;margin-bottom:16px}
.fl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#52525B;margin:14px 0 6px}
.t{width:100%;border:1px solid #E4E4E7;border-radius:10px;padding:9px 12px;font-size:13px;box-sizing:border-box}
.row{display:flex;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #E4E4E7;background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;color:#52525B}
.chip.on{background:#FFF7CC;border-color:#FFC107;color:#6B5A00}
.hint{font-size:11px;color:#A1A1AA;margin-top:6px}
</style></head><body><div class="wrap">
  <h2>Add Men's T-shirts</h2>
  <div class="sub">Men › Topwear › T-shirts</div>
  <div class="row">
    <div style="flex:1"><label class="fl">Product name</label><input class="t" value="Puma Varsity T-shirt"></div>
    <div style="flex:1"><label class="fl">Price (₹)</label><input class="t" value="789"></div>
  </div>
  <div class="row">
    <div style="flex:1"><label class="fl">Brand</label><input class="t" value="Puma" placeholder="Search or type your brand"></div>
    <div style="flex:1"><label class="fl">MRP (optional)</label><input class="t" value="1299"></div>
  </div>
  <label class="fl">Tags <span style="text-transform:none;font-weight:600;color:#A1A1AA">— optional · set by INFLX for featuring</span></label>
  <select class="t" style="max-width:260px">
    <option>Add a tag…</option>
    <option>Wedding</option>
    <option>Clearance</option>
    <option>Premium</option>
  </select>
  <div class="chips" style="margin-top:8px">
    <span class="chip on">Monsoon <b style="margin-left:4px">×</b></span>
    <span class="chip on">New arrival <b style="margin-left:4px">×</b></span>
  </div>
  <div class="hint">Dropdown lists only INFLX's world tags (founder 2026-07-08: "better to give tags info in dropdown"); picked tags appear as removable pills. No custom tags.</div>
</div></body></html>
