<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Basics step — MRP field</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #FAFAFA; color: #0A0A0A;
    font-family: 'Plus Jakarta Sans','Outfit',system-ui,sans-serif; font-size: 13px; }
  .panel { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #E4E4E7;
    border-radius: 14px; padding: 16px; }
  .fl { display: block; font-size: 11px; font-weight: 700; color: #1F1F22; margin: 12px 0 5px; }
  .muted2 { color: #A1A1AA; font-weight: 500; }
  .req { color: #E8401A; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input.t { width: 100%; background: #fff; border: 1px solid #E4E4E7; border-radius: 9px;
    padding: 10px; font-size: 13px; font-family: inherit; color: #0A0A0A; }
  .newtag { font-size: 9px; font-weight: 800; background: #FFF7CC; color: #6B5A00;
    border-radius: 5px; padding: 1px 6px; margin-left: 6px; }
  .review { margin-top: 18px; padding-top: 12px; border-top: 1px dashed #E4E4E7; }
  .revname { font-family: 'Outfit'; font-weight: 800; font-size: 16px; }
  .revmeta { font-size: 13px; color: #52525B; font-weight: 600; margin-top: 2px; }
  .strike { text-decoration: line-through; color: #A1A1AA; margin-left: 6px; }
</style>
</head>
<body>
  <div class="panel">
    <div style="font-family:'Outfit';font-weight:800;font-size:16px;">Add T-Shirt</div>
    <div style="font-size:12px;color:#71717A;margin-bottom:6px;">Men › Topwear › T-Shirt</div>

    <div class="row">
      <div style="width:120px;"><label class="fl">Price ₹ <span class="req">*</span></label><input class="t" value="1499" /></div>
      <div style="width:120px;"><label class="fl">MRP ₹ <span class="muted2">(optional)</span><span class="newtag">NEW</span></label><input class="t" value="1999" /></div>
      <div style="width:100px;"><label class="fl">Stock</label><input class="t" value="20" /></div>
      <div style="flex:1;min-width:150px;"><label class="fl">SKU <span class="muted2">(auto)</span></label><input class="t" placeholder="auto-generated" /></div>
    </div>

    <div class="review">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#71717A;font-weight:800;margin-bottom:6px;">Review</div>
      <div class="revname">HRX Men T-Shirt</div>
      <div class="revmeta">₹1499<span class="strike">₹1999</span> · HRX</div>
    </div>
  </div>
</body>
</html>
