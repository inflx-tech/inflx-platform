<!doctype html>
<html><head><meta charset="utf-8"><title>Canonical 3:4 product card (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;margin:0;padding:24px}
.grid{max-width:340px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid #EEEDEA;border-radius:14px;overflow:hidden;box-shadow:0 6px 12px rgba(0,0,0,.05)}
.img{aspect-ratio:3/4;background:linear-gradient(160deg,#e9edf2,#dfe4ea);position:relative}
.badge{position:absolute;left:8px;top:8px;background:#1A1D1F;color:#F8CB46;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.add{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:15px;background:#fff;border:1px solid #eee;display:flex;align-items:center;justify-content:center;color:#E0A800;font-weight:800}
.meta{padding:10px}
.br{font-size:11px;font-weight:700;color:#0A0A0A}
.nm{font-size:11px;color:#71717A;margin-top:1px}
.pr{font-size:13px;font-weight:800;margin-top:6px}.mrp{font-size:11px;color:#b8b8b2;text-decoration:line-through;margin-left:5px}
</style></head><body>
<div class="grid">
  <div class="card"><div class="img"><span class="badge">40% OFF</span><span class="add">+</span></div><div class="meta"><div class="br">Charvitha</div><div class="nm">Regular Fit Polo</div><div class="pr">₹659<span class="mrp">₹1,099</span></div></div></div>
  <div class="card"><div class="img"><span class="add">+</span></div><div class="meta"><div class="br">Puma</div><div class="nm">Striped Polo Tee</div><div class="pr">₹1,299</div></div></div>
</div>
<p style="max-width:340px;margin:12px auto 0;font-size:12px;color:#71717A">One 3:4 card used on every product surface (browse grid, view-all, home rails). Crop-aspect matches, so uploads show as cropped.</p>
</body></html>
