<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Filter sheet — restyle</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{margin:0;background:rgba(0,0,0,.45);min-height:560px;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:380px;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 24px}
  .handle{width:40px;height:4px;border-radius:2px;background:#E2E2E6;margin:0 auto 14px}
  .head{display:flex;justify-content:space-between;align-items:center}
  .title{font-size:17px;font-weight:800;color:#1A1D1F}
  .clear{font-size:12.5px;font-weight:700;color:#E11D6B}
  .sec{font-size:12.5px;font-weight:700;color:#1A1D1F;margin:16px 0 9px}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}
  .p{border:1px solid #E6E6EA;border-radius:20px;padding:8px 14px;font-size:12.5px;color:#1A1D1F;background:#fff}
  .p.on{background:#E11D6B;border-color:#E11D6B;color:#fff;font-weight:700}
  .actions{display:flex;gap:10px;margin-top:18px}
  .cancel{flex:1;border:1px solid #E8EAED;border-radius:11px;padding:13px;text-align:center;font-weight:700;color:#1A1D1F}
  .apply{flex:2;background:#E11D6B;border-radius:11px;padding:13px;text-align:center;font-weight:800;color:#fff}
</style></head><body>
<div class="sheet">
  <div class="handle"></div>
  <div class="head"><div class="title">Filter &amp; sort</div><div class="clear">Clear all</div></div>
  <div class="sec">Sort by</div>
  <div class="wrap"><span class="p on">Newest</span><span class="p">Price: low to high</span><span class="p">Price: high to low</span><span class="p">Discount</span></div>
  <div class="sec">Brand</div>
  <div class="wrap"><span class="p on">Nike (2)</span><span class="p">Adidas (2)</span><span class="p">Puma (1)</span><span class="p">US Polo Assn (2)</span></div>
  <div class="sec">Size</div>
  <div class="wrap"><span class="p">S</span><span class="p on">M</span><span class="p">L</span><span class="p">XL</span></div>
  <div class="sec">Colour / tone</div>
  <div class="wrap"><span class="p">Black</span><span class="p">White</span><span class="p">Blue</span><span class="p">Grey</span></div>
  <div class="actions"><div class="cancel">Cancel</div><div class="apply">Apply</div></div>
</div>
</body></html>
