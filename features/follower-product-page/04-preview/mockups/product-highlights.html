<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product page — Highlights + View details</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{margin:0;background:#F3F4F6;padding:16px;color:#1A1D1F}
  .ph{max-width:380px;margin:0 auto;background:#fff;border-radius:14px;padding:16px}
  .nm{font-size:16px;font-weight:700}
  .price{margin:6px 0 16px}.price b{font-size:18px}.mrp{color:#9CA3AF;text-decoration:line-through;margin-left:6px}.off{color:#159B6E;font-weight:700;margin-left:8px;font-size:13px}
  .head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 11px}
  .h{font-size:11px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px}
  .vd{font-size:12.5px;font-weight:700;color:#E11D6B}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .tile{background:#F5F6F8;border-radius:10px;padding:9px;min-height:58px}
  .k{font-size:10.5px;color:#6B7280;margin-bottom:4px}
  .v{font-size:12.5px;font-weight:700;color:#1A1D1F;line-height:16px}
  .add{margin-top:18px;background:#E11D6B;color:#fff;text-align:center;border-radius:12px;padding:13px;font-weight:800}
</style></head><body>
<div class="ph">
  <div class="nm">Allen Solly Cotton T-Shirt</div>
  <div class="price"><b>₹672</b><span class="mrp">₹961</span><span class="off">30% off</span></div>
  <div class="head"><div class="h">Highlights</div><div class="vd">View details ›</div></div>
  <div class="grid">
    <div class="tile"><div class="k">Brand</div><div class="v">Allen Solly</div></div>
    <div class="tile"><div class="k">Colour / Tone</div><div class="v">Black, Grey</div></div>
    <div class="tile"><div class="k">Fabric</div><div class="v">Cotton</div></div>
    <div class="tile"><div class="k">Fit</div><div class="v">Regular</div></div>
    <div class="tile"><div class="k">Occasion</div><div class="v">Casual</div></div>
    <div class="tile"><div class="k">Returns</div><div class="v">7-day return</div></div>
  </div>
  <div class="add">Add to cart</div>
</div>
</body></html>
