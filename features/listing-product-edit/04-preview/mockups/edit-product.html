<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit product — drill-down stepper</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #FAFAFA; color: #0A0A0A;
    font-family: 'Plus Jakarta Sans','Outfit',system-ui,sans-serif; font-size: 13px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-family: 'Outfit',sans-serif; font-size: 22px; font-weight: 700; margin: 0; }
  .rule { width: 42px; height: 3px; background: #FFC107; border-radius: 2px; margin: 6px 0 10px; }
  .sub { font-size: 12px; color: #71717A; }
  .panel { background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; padding: 16px; margin-top: 10px; }
  .phead { font-family: 'Outfit'; font-weight: 800; font-size: 16px; }
  .fl { display: block; font-size: 11px; font-weight: 700; color: #1F1F22; margin: 12px 0 5px; }
  .muted2 { color: #A1A1AA; font-weight: 500; }
  .req { color: #E8401A; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input.t, textarea.t { width: 100%; background: #fff; border: 1px solid #E4E4E7; border-radius: 9px;
    padding: 10px; font-size: 13px; font-family: inherit; color: #0A0A0A; }
  textarea.t { resize: vertical; min-height: 72px; }
  .imgs { display: flex; gap: 8px; margin-top: 6px; }
  .thumb { width: 62px; height: 62px; border-radius: 9px; border: 1px solid #E4E4E7; background: #F4F4F5;
    display: flex; align-items: center; justify-content: center; color: #A1A1AA; }
  .steps { display: flex; gap: 8px; margin-bottom: 12px; font-size: 11px; font-weight: 700; color: #A1A1AA; }
  .steps .on { color: #0A0A0A; }
  .nav { display: flex; justify-content: space-between; margin-top: 16px; border-top: 1px solid #E4E4E7; padding-top: 14px; }
  .btn { padding: 11px 16px; border: 0; border-radius: 11px; font-size: 13px; font-weight: 800; cursor: pointer; }
  .btn.yellow { background: #FFC107; color: #0A0A0A; }
  .btn.ghost { background: #fff; border: 1px solid #E4E4E7; color: #1F1F22; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Edit Fashion product</h1>
    <div class="rule"></div>
    <div class="sub">Update photos, price, description, colours/sizes and other details — then save.</div>

    <div class="panel">
      <div class="phead">Edit Kurta / Kurti</div>
      <div class="sub" style="margin-bottom:6px;">Women › Ethnic Wear › Kurta / Kurti</div>
      <div class="steps"><span class="on">1 Basics</span><span>2 Variants</span><span>3 Details</span><span>4 Review</span></div>

      <label class="fl">Cover photos (up to 6) — the first is the cover <span class="req">*</span></label>
      <div class="imgs"><span class="thumb">▦</span><span class="thumb">▦</span><span class="thumb" style="border-style:dashed;">＋</span></div>

      <div class="row" style="margin-top:8px;">
        <div style="flex:1;min-width:170px;"><label class="fl">Product name <span class="req">*</span></label><input class="t" value="Biba Kurta" /></div>
        <div style="flex:1;min-width:150px;"><label class="fl">Brand</label><input class="t" value="Biba" /></div>
      </div>
      <div class="row">
        <div style="width:130px;"><label class="fl">Price ₹ <span class="req">*</span></label><input class="t" value="1399" /></div>
        <div style="width:110px;"><label class="fl">Stock</label><input class="t" value="25" /></div>
        <div style="flex:1;min-width:150px;"><label class="fl">SKU <span class="muted2">(fixed)</span></label><input class="t" value="CHVW-0007" readonly /></div>
      </div>
      <div>
        <label class="fl">Description <span class="muted2">(optional)</span></label>
        <textarea class="t">Straight-cut cotton kurta, breathable for daily wear. Machine wash cold.</textarea>
      </div>

      <div class="nav">
        <button class="btn ghost">‹ Cancel</button>
        <button class="btn yellow">Save changes</button>
      </div>
    </div>
  </div>
</body>
</html>
