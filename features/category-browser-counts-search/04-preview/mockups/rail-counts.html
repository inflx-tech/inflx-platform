<!doctype html>
<html><head><meta charset="utf-8"><title>Rail counts (mockup)</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;margin:0;padding:24px;font-size:13px}
.wrap{max-width:300px;margin:0 auto;background:#fff;border:1px solid #E4E4E7;border-radius:12px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #F4F4F5;font-weight:800}
.hd .s{margin-left:auto;font-size:16px}
.rail{width:88px;padding:6px 0}
.ri{padding:9px 4px;text-align:center}
.ri.on{background:#FFFBEB}
.img{width:44px;height:44px;border-radius:10px;background:#EAF1FF;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;color:#1D4ED8}
.nm{font-size:10px;color:#52525B}
.ct{font-size:9px;color:#A1A1AA;margin-top:1px}
</style></head><body><div class="wrap">
  <div class="hd">← Polo <span class="s">⌕</span></div>
  <div class="rail">
    <div class="ri"><div class="img">◆</div><div class="nm">T-Shirt</div><div class="ct">128 items</div></div>
    <div class="ri on"><div class="img">◆</div><div class="nm">Polo</div><div class="ct">6 items</div></div>
    <div class="ri"><div class="img">◆</div><div class="nm">Shirt</div><div class="ct">54 items</div></div>
  </div>
</div>
<p style="max-width:300px;margin:12px auto 0;font-size:12px;color:#71717A">Each category shows its live product count (Blinkit-style). The ⌕ now opens search.</p>
</body></html>
