<!doctype html>
<html><head><meta charset="utf-8"><title>Phase 4c — banner with inline matches</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f9fafb;margin:0;padding:24px;color:#111}
  .phone{max-width:380px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:16px}
  .banner{background:#f6efe2;border-radius:18px;padding:18px;position:relative;min-height:150px}
  .eyebrow{font-size:11px;font-weight:800;color:#c2410c;letter-spacing:.5px}
  .title{font-size:25px;font-weight:800;color:#1a1a1a;margin-top:4px;line-height:27px}
  .previewRow{display:flex;align-items:center;gap:6px;margin-top:8px}
  .thumb{width:34px;height:34px;border-radius:8px;background:#e7e0d2 center/cover no-repeat}
  .brands{font-size:11px;font-weight:700;color:#1a1a1a;margin-left:4px}
  .btn{margin-top:14px;display:inline-block;background:#6b4a2c;color:#f8efe0;border-radius:10px;padding:11px 20px;font-size:12px;font-weight:800;letter-spacing:.5px}
  .note{font-size:11px;color:#9ca3af;text-align:center;margin-top:14px}
</style></head><body>

<div class="phone">
  <div class="banner">
    <div class="eyebrow">MEGA SALE</div>
    <div class="title">Sarees 80% off</div>
    <div class="previewRow">
      <div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
      <div class="brands">At Charvitha Fashions · Silk Story</div>
    </div>
    <span class="btn">SHOP NOW</span>
  </div>
  <div class="note">≤3 matched thumbnails + distinct stores, between sub-line and CTA · absent on old backends · banner still hides entirely where nothing matches (Phase 2)</div>
</div>

</body></html>
