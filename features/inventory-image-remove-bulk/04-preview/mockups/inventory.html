<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;padding:20px;background:#f3f4f6}.wrap{max-width:640px;margin:auto}
.bar{display:flex;align-items:center;gap:12px;background:#FFF7CC;border:1px solid #F8CB46;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.bar b{font-size:12px}.bar .d{font-size:12px;font-weight:800;color:#dc2626}.bar .c{margin-left:auto;font-size:12px;color:#6b7280}
.row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:8px}
.row.sel{border-color:#F8CB46;box-shadow:0 0 0 1px #F8CB46}
.ck{width:16px;height:16px}.img{width:80px;height:56px;border-radius:8px;background:#e7e0d2 center/cover;flex-shrink:0}
.r{background-image:url('https://inflx-platform.onrender.com/v1/media/assets/7dcd6169-40ad-4cb9-bfa1-b6637ba970dc')}
.nm{font-weight:700;font-size:14px}.badge{font-size:10px;background:#dcfce7;color:#15803d;border-radius:99px;padding:1px 8px;margin-left:6px}
.pr{margin-left:auto;font-weight:800}.rm{color:#f87171;font-size:12px;font-weight:700}
</style></head><body><div class="wrap">
<div style="font-size:11px;font-weight:800;color:#9ca3af;text-transform:uppercase;margin-bottom:8px">Polo — 3 products &nbsp;·&nbsp; ☑ Select all</div>
<div class="bar"><b>2 selected</b><span class="d">🗑 Delete selected (2)</span><span class="c">Clear</span></div>
<div class="row sel"><input class="ck" type="checkbox" checked><div class="img r"></div><div class="nm">Classic Cotton Polo<span class="badge">In store</span></div><div class="pr">₹999</div><span class="rm">Remove</span></div>
<div class="row sel"><input class="ck" type="checkbox" checked><div class="img r"></div><div class="nm">Premium Striped Polo<span class="badge">In store</span></div><div class="pr">₹1,299</div><span class="rm">Remove</span></div>
<div class="row"><input class="ck" type="checkbox"><div class="img r"></div><div class="nm">Regular Fit Polo<span class="badge">In store</span></div><div class="pr">₹1,099</div><span class="rm">Remove</span></div>
</div></body></html>
